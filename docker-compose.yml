services:
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/apps/staticfiles
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started

  db:
    image: postgres:15-alpine
    container_name: postgres
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrations:
    build: .
    container_name: migrations
    env_file:
      - ./.env
    environment:
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
    command: >
      bash -c "
      echo 'Waiting for database...' && \
      until pg_isready -h db -U ${POSTGRES_USER} -d ${POSTGRES_DB}; do
        sleep 2
      done && \
      echo 'Database is ready. Running migrations...' && \
      python3 manage.py migrate --no-input && \
      python3 manage.py collectstatic -c --no-input && \
      echo 'Migrations completed!'"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/apps
      - static_volume:/apps/staticfiles
    restart: "no"

  backend:
    build: .
    container_name: backend
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    env_file:
      - ./.env
    environment:
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
    expose:
      - "8000"
    depends_on:
      migrations:
        condition: service_completed_successfully
    volumes:
      - .:/apps
      - static_volume:/apps/staticfiles
    restart: unless-stopped

  celery:
    build: .
    container_name: celery
    user: celery:celery
    command: poetry run celery -A config worker -l INFO
    env_file:
      - ./.env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
    depends_on:
      - db
      - redis
    volumes:
      - .:/apps
    restart: unless-stopped

  celery_beat:
    build: .
    container_name: celery_beat
    user: celery:celery
    env_file:
      - ./.env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
    command: poetry run celery -A config beat -l INFO -S django
    depends_on:
      - db
      - redis
      - celery
    volumes:
      - .:/apps
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  static_volume:
