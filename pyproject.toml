[project]
name = "library-api"
version = "0.1.0"
description = ""
authors = [
    {name = "Артем Бичеров",email = "jaineut@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "poetry-core (>=2.5.0,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "django (>=6.1.1,<7.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "ipython (>=9.17.1,<10.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "djangorestframework (>=3.18.1,<4.0.0)",
    "django-filter (>=26.2,<27.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "coverage (>=7.16.2,<8.0.0)",
    "drf-spectacular (>=0.30.0,<0.31.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "gunicorn (>=26.2.0,<27.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.4.1,<8.0.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "black (>=26.10.0,<27.0.0)",
    "isort (>=9.0.2,<10.0.0)"
]

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = ["venv", ".venv"]

[tool.black]
# Максимальная длина строки
line-length = 119
# Файлы, которые не нужно форматировать
exclude = '''
(
  /(
      \.eggs         # Исключить несколько общих каталогов
    | \.git          # в корне проекта
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist
  )/
  | foo.py           # Также отдельно исключить файл с именем foo.py
                     # в корне проекта
)
'''

[tool.isort]
# максимальная длина строки
line_length = 119


